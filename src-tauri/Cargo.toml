
[package]
name = "led_tracker_app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

[lib]
name = "led_tracker_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]

# Tauri
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "full"] }

# WebSocket
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"

# HTTP API
axum = "0.8"

# SQLite native library
libsqlite3-sys = { version = "0.39.0", features = ["bundled"] }

# Rusqlite
rusqlite = { version = "0.41", features = ["bundled"] }

# Environment variables
dotenvy = "0.15"
tower-http = { version = "0.7.1", features = ["cors"] }

# Release configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
